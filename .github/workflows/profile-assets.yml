name: Generate profile assets

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      # Optional PAT secret with repo + read:user scopes to include private contributions
      STATS_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: generate stats.svg
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=default&bg_color=00000000&hide_border=true
          path: dist/stats.svg
          token: ${{ env.STATS_TOKEN }}
          fail_on_error: true

      - name: generate stats-dark.svg
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dark&bg_color=00000000&hide_border=true
          path: dist/stats-dark.svg
          token: ${{ env.STATS_TOKEN }}
          fail_on_error: true

      - name: generate top-langs.svg
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=default&bg_color=00000000&hide_border=true
          path: dist/top-langs.svg
          token: ${{ env.STATS_TOKEN }}
          fail_on_error: true

      - name: generate top-langs-dark.svg
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=dark&bg_color=00000000&hide_border=true
          path: dist/top-langs-dark.svg
          token: ${{ env.STATS_TOKEN }}
          fail_on_error: true

      - name: push assets to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
